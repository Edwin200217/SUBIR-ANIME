    // --- CATÁLOGO DEMO INICIAL ---
    const DEFAULT_ANIMES = [
      {

            { id: "e2", episodeNumber: 2, title: "Si hubiera tenido otra oportunidad", durationMinutes: 24, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" }

      {

        type: "Serie",

        bannerUrl: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1920&auto=format&fit=crop&q=85",
        posterUrl: "https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop&q=80",

          episodes: [
            { id: "e1", episodeNumber: 1, title: "Hacia el Castillo del Destino", durationMinutes: 25, videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" }

      {

        genres: ["Aventura", "Fantasía", "Drama"],

        posterUrl: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=800&auto=format&fit=crop&q=80",

        isPublished: true,
        seasons: [{
          id: "s1",
          seasonNumber: 1,
          title: "Película Completa",

          ]
        }]
      }
    ];

    // Subtítulos sincronizados para audio latino
    const SAMPLE_SUBTITLES = [
      { id: '1', startTime: 1, endTime: 4, text: "¡El despertar de la sombra ha comenzado!" },
      { id: '2', startTime: 5, endTime: 9, text: "¿Acaso crees que este es el límite de mi poder?" },
      { id: '3', startTime: 10, endTime: 15, text: "[Español Latino] ¡SURGE! (Comando de Invocación)" },
      { id: '4', startTime: 16, endTime: 22, text: "A partir de este instante, lucharás bajo mis órdenes." }
    ];

    // --- INTRO ESTILO NETFLIX CON LA LETRA 'K' ---
    const NetflixIntro = ({ onComplete }) => {
      const [phase, setPhase] = useState('initial');

      useEffect(() => {
        // Sintetizador de sonido Ta-Dum cinematográfico
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            const ctx = new AudioCtx();
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(55, ctx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(32, ctx.currentTime + 1.8);
            gain1.gain.setValueAtTime(0.7, ctx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.2);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start();
            osc1.stop(ctx.currentTime + 2.3);
          }
        } catch(e) {}

        const t1 = setTimeout(() => setPhase('boom'), 200);
        const t2 = setTimeout(() => setPhase('fade'), 2600);
        const t3 = setTimeout(() => onComplete(), 3200);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
      }, []);

      return (
        <div className={`fixed inset-0 z-50 flex items-center justify-center bg-black transition-opacity duration-700 select-none ${phase === 'fade' ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>
          <button onClick={onComplete} className="absolute top-6 right-6 px-3 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs font-mono text-slate-300 border border-white/10">
            Omitir [ESC]
          </button>
          <div className="flex flex-col items-center">
            <div className={`transition-all duration-1000 ease-out transform ${phase === 'initial' ? 'scale-50 opacity-0' : phase === 'boom' ? 'scale-100 opacity-100' : 'scale-[2.5] opacity-0 blur-sm'}`}>
              <svg viewBox="0 0 160 220" className="w-32 h-44 sm:w-44 sm:h-60" fill="none">
                <defs>
                  <linearGradient id="nfx-left" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stopColor="#8A050B"/>
                    <stop offset="100%" stopColor="#E50914"/>
                  </linearGradient>
                  <linearGradient id="nfx-diag" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#FF262E"/>
                    <stop offset="50%" stopColor="#E50914"/>
                    <stop offset="100%" stopColor="#750409"/>
                  </linearGradient>
                </defs>
                {/* Letra K Estilo Netflix */}
                <path d="M28 10 L64 10 L64 200 C52 204 40 204 28 200 Z" fill="url(#nfx-left)" />
                <path d="M54 126 L108 10 L144 10 L80 142 Z" fill="#E50914" />
                <path d="M62 98 L94 98 L148 200 C136 204 122 204 110 200 L62 124 Z" fill="url(#nfx-diag)" />
              </svg>
            </div>
            <div className={`mt-6 text-center transition-all duration-700 ${phase === 'boom' ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
              <h1 className="text-3xl sm:text-4xl font-extrabold tracking-[0.25em] text-white">
                KAGE<span className="text-[#E50914]">STREAM</span>
              </h1>
              <p className="text-[11px] font-mono tracking-[0.3em] text-slate-400 mt-2">TU UNIVERSO ANIME</p>
            </div>
          </div>
        </div>
      );
    };

    // --- REPRODUCTOR DE VIDEO CON SUBTÍTULOS LATINOS ---
    const VideoPlayer = ({ anime, episodeNumber = 1, onClose }) => {
      const videoRef = useRef(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(100);
      const [isPlaying, setIsPlaying] = useState(true);
      const [subtitlesEnabled, setSubtitlesEnabled] = useState(true);
      const [audioLang, setAudioLang] = useState("Español Latino (Oficial)");

      const currentSub = SAMPLE_SUBTITLES.find(s => currentTime >= s.startTime && currentTime <= s.endTime);

      const togglePlay = () => {
        if (!videoRef.current) return;
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center">
          <div className="absolute top-4 inset-x-4 flex items-center justify-between z-20 pointer-events-auto">
            <div>
              <span className="text-xs text-red-500 font-bold uppercase tracking-wider">Reproduciendo Ep. {episodeNumber}</span>
              <h3 className="text-lg font-bold text-white drop-shadow">{anime.title}</h3>
            </div>
            <button onClick={onClose} className="p-2 rounded-full bg-white/10 hover:bg-white/20 text-white backdrop-blur-md">
              <Icon name="x" className="w-6 h-6" />
            </button>
          </div>

          <div className="relative w-full h-full flex items-center justify-center" onClick={togglePlay}>
            <video
              ref={videoRef}
              src={anime.videoUrl || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"}
              className="max-h-full max-w-full object-contain"
              autoPlay
              onTimeUpdate={(e) => setCurrentTime(e.target.currentTime)}
              onLoadedMetadata={(e) => setDuration(e.target.duration)}
            />

            {/* Subtítulos en pantalla */}
            {subtitlesEnabled && currentSub && (
              <div className="absolute bottom-24 inset-x-8 text-center pointer-events-none">
                <span className="inline-block px-4 py-1.5 rounded-lg bg-black/80 text-yellow-300 text-base sm:text-xl font-medium tracking-wide shadow-2xl backdrop-blur-sm border border-yellow-500/20">
                  {currentSub.text}
                </span>
              </div>
            )}
          </div>

          {/* Barra de Controles Inferior */}
          <div className="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black via-black/80 to-transparent flex flex-col gap-2 z-20">
            <input
              type="range"
              min="0"
              max={duration || 100}
              value={currentTime}
              onChange={(e) => {
                if (videoRef.current) videoRef.current.currentTime = Number(e.target.value);
              }}
              className="w-full accent-red-600 h-1.5 bg-white/20 rounded cursor-pointer"
            />

            <div className="flex items-center justify-between text-xs sm:text-sm text-slate-200">
              <div className="flex items-center gap-4">
                <button onClick={togglePlay} className="p-2 text-white hover:text-red-500 transition-colors">
                  <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" />
                </button>
                <span>{Math.floor(currentTime / 60)}:{Math.floor(currentTime % 60).toString().padStart(2, '0')} / {Math.floor(duration / 60)}:{Math.floor(duration % 60).toString().padStart(2, '0')}</span>
              </div>

              <div className="flex items-center gap-3">
                {/* Selector de Audio */}
                <select
                  value={audioLang}
                  onChange={(e) => setAudioLang(e.target.value)}
                  className="bg-black/60 border border-white/20 rounded-lg px-2.5 py-1 text-xs text-white"
                >
                  <option>Español Latino (Oficial)</option>
                  <option>Japonés (Original)</option>
                  <option>Inglés (Doblaje)</option>
                </select>

                {/* Alternar Subtítulos */}
                <button
                  onClick={() => setSubtitlesEnabled(!subtitlesEnabled)}
                  className={`flex items-center gap-1 px-2.5 py-1 rounded-lg border text-xs font-semibold ${subtitlesEnabled ? 'bg-red-600 border-red-500 text-white' : 'bg-black/50 border-white/20 text-slate-400'}`}
                >
                  <Icon name="subtitles" className="w-3.5 h-3.5" />
                  <span>Sub: {subtitlesEnabled ? 'ON' : 'OFF'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- MODAL DETALLES DEL ANIME ---
    const DetailsModal = ({ anime, onClose, onPlay, onDelete, isSaved, onToggleList }) => {
      if (!anime) return null;
      return (
        <div className="fixed inset-0 z-40 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="relative w-full max-w-2xl bg-[#0d111a] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">

            <div className="relative h-64 sm:h-80">

              <div className="absolute bottom-4 left-6 right-6 flex items-end justify-between">

                  <span className="px-2 py-0.5 rounded bg-red-600 text-[10px] font-bold text-white uppercase">{anime.type}</span>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white mt-1">{anime.title}</h2>
                  <p className="text-xs text-slate-300 font-mono">{anime.altTitle}</p>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => onPlay(anime)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-lg">
                    <Icon name="play" className="w-4 h-4" />

                  <button onClick={() => onToggleList(anime.id)} className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white border border-white/10">

                  </button>
                  <button onClick={() => onDelete(anime.id)} className="p-2 rounded-xl bg-red-950/80 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30" title="Borrar publicación">

                </div>
              </div>
            </div>

            <div className="p-6 space-y-4">
              <div className="flex items-center gap-4 text-xs text-slate-400">
                <span className="flex items-center gap-1 text-amber-400 font-bold"><Icon name="star" className="w-3.5 h-3.5" /> {anime.score}</span>
                <span>{anime.year}</span>
                <span>{anime.status}</span>
                <div className="flex gap-1.5">
                  {anime.genres.map(g => (

                        <span className="text-red-500 font-bold">Ep. {ep.episodeNumber}</span>

                      </div>
                      <span className="text-slate-400 text-[11px]">{ep.durationMinutes} min</span>
                    </div>

                </div>
              </div>
            </div>
          </div>

    // --- MODAL DE SUBIR / PUBLICAR ANIME ---
    const UploadModal = ({ isOpen, onClose, onSave }) => {
      const [title, setTitle] = useState('');
      const [synopsis, setSynopsis] = useState('');
      const [type, setType] = useState('Serie');
      const [posterUrl, setPosterUrl] = useState('');
      const [bannerUrl, setBannerUrl] = useState('');
      const [videoUrl, setVideoUrl] = useState('');
      const [genres, setGenres] = useState('Acción, Fantasía');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;
        const newAnime = {
          id: 'anime_' + Date.now(),
          title,
          synopsis: synopsis || 'Sin sinopsis disponible.',
          type,
          status: 'En emisión',
          year: new Date().getFullYear(),
          score: 9.0,
          genres: genres.split(',').map(g => g.trim()),
          posterUrl: posterUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&auto=format&fit=crop&q=80',
          bannerUrl: bannerUrl || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1920&auto=format&fit=crop&q=85',
          videoUrl: videoUrl || 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
          isPublished: true,
          seasons: [{
            id: 's1',
            seasonNumber: 1,
            title: 'Temporada 1',
            episodes: [{ id: 'e1', episodeNumber: 1, title: 'Episodio 1: Comienzo', durationMinutes: 24, videoUrl }]
          }]
        };
        onSave(newAnime);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-lg bg-[#0d111a] border border-white/10 rounded-2xl p-6 shadow-2xl">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-base font-bold text-white flex items-center gap-2">
                <Icon name="upload" className="w-4 h-4 text-red-500" />
                <span>Subir y Publicar Contenido</span>
              </h3>
              <button onClick={onClose} className="p-1 rounded text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-400 mb-1">Título del Anime *</label>
                <input required value={title} onChange={e => setTitle(e.target.value)} placeholder="Ej: Dragon Ball Daima" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white" />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-400 mb-1">Tipo</label>
                  <select value={type} onChange={e => setType(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white">
                    <option>Serie</option>
                    <option>Película</option>
                    <option>OVA</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Géneros (separados por coma)</label>
                  <input value={genres} onChange={e => setGenres(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white" />
                </div>
              </div>

              <div>
                <label className="block text-slate-400 mb-1">URL del Video (MP4 / WebM / HLS)</label>
                <input value={videoUrl} onChange={e => setVideoUrl(e.target.value)} placeholder="https://.../video.mp4" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white" />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">URL de Portada (Poster)</label>
                <input value={posterUrl} onChange={e => setPosterUrl(e.target.value)} placeholder="https://.../poster.jpg" className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white" />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Sinopsis</label>
                <textarea rows="3" value={synopsis} onChange={e => setSynopsis(e.target.value)} placeholder="Describe la historia..." className="w-full bg-black/50 border border-white/10 rounded-lg p-2 text-white" />
              </div>

              <div className="pt-3 flex justify-end gap-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg bg-white/5 text-slate-300">Cancelar</button>
                <button type="submit" className="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-500 font-bold text-white">Publicar Ahora</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // --- APLICACIÓN PRINCIPAL ---
    function App() {
      const [animes, setAnimes] = useState(() => {
        try {
          const saved = localStorage.getItem('kagestream_animes');
          return saved ? JSON.parse(saved) : DEFAULT_ANIMES;
        } catch(e) {
          return DEFAULT_ANIMES;
        }
      });

      const [myList, setMyList] = useState(() => {
        try {
          const saved = localStorage.getItem('kagestream_mylist');
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      const [showIntro, setShowIntro] = useState(() => {
        try {
          return !sessionStorage.getItem('kagestream_intro_seen');
        } catch(e) {
          return true;
        }
      });

      const [activeTab, setActiveTab] = useState('home');
      const [selectedAnime, setSelectedAnime] = useState(null);
      const [playingAnime, setPlayingAnime] = useState(null);
      const [uploadOpen, setUploadOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [bgScene, setBgScene] = useState('https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1920&auto=format&fit=crop&q=85');

      // Guardar en LocalStorage al actualizar
      useEffect(() => {
        localStorage.setItem('kagestream_animes', JSON.stringify(animes));
      }, [animes]);

      useEffect(() => {
        localStorage.setItem('kagestream_mylist', JSON.stringify(myList));
      }, [myList]);

      const handleIntroDone = () => {
        try { sessionStorage.setItem('kagestream_intro_seen', 'true'); } catch(e) {}
        setShowIntro(false);
      };

      // Borrar publicación
      const handleDeleteAnime = (id) => {
        if (confirm("¿Estás seguro de que deseas eliminar esta publicación de tu catálogo?")) {
          setAnimes(prev => prev.filter(a => a.id !== id));
          setMyList(prev => prev.filter(item => item !== id));
          if (selectedAnime?.id === id) setSelectedAnime(null);
          if (playingAnime?.id === id) setPlayingAnime(null);
        }
      };

      const handleToggleList = (id) => {
        setMyList(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const handleSaveUpload = (newAnime) => {
        setAnimes(prev => [newAnime, ...prev]);
      };

      // Filtrado por búsqueda y categoría
      const filteredAnimes = animes.filter(a => {
        const matchesSearch = a.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              a.genres.some(g => g.toLowerCase().includes(searchQuery.toLowerCase()));
        if (!matchesSearch) return false;
        if (activeTab === 'movies') return a.type === 'Película';
        if (activeTab === 'series') return a.type === 'Serie';
        if (activeTab === 'mylist') return myList.includes(a.id);
        return true;
      });

      return (
        <div className="relative min-h-screen">
          {/* FONDO DINÁMICO DE ANIME */}
          <div className="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
            <img src={bgScene} className="w-full h-full object-cover filter brightness-[0.65] contrast-[1.1]" />
            <div className="absolute inset-0 bg-gradient-to-t from-[#07090e] via-[#07090e]/50 to-[#07090e]/80" />
          </div>

          {/* INTRO ESTILO NETFLIX (Solo al inicio de la sesión) */}
          {showIntro && <NetflixIntro onComplete={handleIntroDone} />}

          {/* BARRA DE NAVEGACIÓN SUPERIOR */}
          <header className="sticky top-0 z-30 glass-panel border-b border-white/10 px-4 sm:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-6">
              <div onClick={() => setActiveTab('home')} className="flex items-center gap-2 cursor-pointer">
                <span className="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-extrabold text-white text-lg">K</span>
                <span className="text-lg font-extrabold tracking-wider text-white">KAGE<span className="text-red-500">STREAM</span></span>
              </div>

              <nav className="hidden md:flex items-center gap-1 text-xs font-semibold text-slate-300">
                {[
                  { id: 'home', label: 'Inicio' },
                  { id: 'series', label: 'Series' },
                  { id: 'movies', label: 'Películas' },
                  { id: 'mylist', label: 'Mi Lista' }
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`px-3 py-1.5 rounded-lg transition-colors ${activeTab === t.id ? 'bg-white/10 text-white font-bold' : 'hover:text-white'}`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="flex items-center gap-3">
              {/* Buscador */}
              <div className="relative hidden sm:block">
                <Icon name="search" className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400" />
                <input
                  type="text"
                  placeholder="Buscar anime, género..."
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="bg-black/50 border border-white/10 rounded-full pl-8 pr-4 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-red-500 w-44 lg:w-60"
                />
              </div>

              {/* Botón Subir Publicación */}
              <button
                onClick={() => setUploadOpen(true)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-lg shadow-red-950/40"
              >
                <Icon name="upload" className="w-3.5 h-3.5" />
                <span>Subir</span>
              </button>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="max-w-7xl mx-auto px-4 sm:px-8 py-6 space-y-8">
            {/* HERO SECTION (En la pestaña Inicio) */}
            {activeTab === 'home' && animes.length > 0 && (
              <div className="relative rounded-2xl overflow-hidden glass-panel border border-white/10 min-h-[340px] sm:min-h-[420px] flex items-end p-6 sm:p-10">
                <img src={animes[0].bannerUrl} className="absolute inset-0 w-full h-full object-cover filter brightness-[0.7]" />
                <div className="absolute inset-0 bg-gradient-to-t from-[#07090e] via-[#07090e]/40 to-transparent" />
                
                <div className="relative z-10 max-w-xl space-y-3">
                  <span className="px-2 py-0.5 rounded bg-red-600 text-[10px] font-bold text-white uppercase">DESTACADO</span>
                  <h1 className="text-3xl sm:text-5xl font-extrabold text-white leading-tight">{animes[0].title}</h1>
                  <p className="text-xs sm:text-sm text-slate-300 line-clamp-3 leading-relaxed">{animes[0].synopsis}</p>
                  
                  <div className="flex items-center gap-3 pt-2">
                    <button
                      onClick={() => setPlayingAnime(animes[0])}
                      className="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs sm:text-sm font-bold shadow-xl shadow-red-950/50"
                    >
                      <Icon name="play" className="w-4 h-4" />
                      <span>REPRODUCIR</span>
                    </button>
                    <button
                      onClick={() => setSelectedAnime(animes[0])}
                      className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-bold backdrop-blur-sm border border-white/10"
                    >
                      <Icon name="info" className="w-4 h-4" />
                      <span>MÁS INFORMACIÓN</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* SECCIÓN DE TÍTULOS Y TARJETAS */}
            <div className="space-y-4">
              <div className="flex items-center justify-between">
                <h2 className="text-lg sm:text-xl font-bold text-white">
                  {activeTab === 'home' ? 'Catálogo Completo' : activeTab === 'series' ? 'Series' : activeTab === 'movies' ? 'Películas' : 'Mi Lista'}
                </h2>
                <span className="text-xs text-slate-400 font-mono">{filteredAnimes.length} títulos</span>
              </div>

              {filteredAnimes.length === 0 ? (
                <div className="text-center py-16 text-slate-400 text-sm">
                  No se encontraron animes en esta sección.
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4">
                  {filteredAnimes.map(anime => (
                    <div
                      key={anime.id}
                      className="group relative rounded-xl overflow-hidden glass-panel border border-white/10 hover:border-red-500/50 transition-all flex flex-col"
                    >
                      <div
                        className="relative aspect-[3/4] overflow-hidden bg-slate-900 cursor-pointer"
                        onClick={() => setSelectedAnime(anime)}
                      >
                        <img src={anime.posterUrl} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-60 group-hover:opacity-90" />

                        {/* Botón Reproducción Directa */}
                        <button
                          onClick={(e) => { e.stopPropagation(); setPlayingAnime(anime); }}
                          className="absolute inset-0 m-auto w-10 h-10 rounded-full bg-red-600 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 hover:scale-110 transition-all shadow-xl"
                        >
                          <Icon name="play" className="w-4 h-4 ml-0.5" />
                        </button>

                        {/* BOTÓN BORRAR PUBLICACIÓN */}
                        <button
                          onClick={(e) => { e.stopPropagation(); handleDeleteAnime(anime.id); }}
                          className="absolute top-2 right-2 p-1.5 rounded-lg bg-black/70 hover:bg-red-600 text-slate-300 hover:text-white transition-all"
                          title="Borrar publicación"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>

                        <div className="absolute bottom-2 left-2 right-2 flex items-center justify-between text-[11px] text-white">
                          <span className="flex items-center gap-1 font-bold"><Icon name="star" className="w-3 h-3 text-amber-400" /> {anime.score}</span>
                          <span className="px-1.5 py-0.5 rounded bg-red-600 text-[10px] font-bold">{anime.type}</span>
                        </div>
                      </div>

                      <div className="p-2.5 flex flex-col justify-between flex-grow">
                        <h4 onClick={() => setSelectedAnime(anime)} className="text-xs sm:text-sm font-bold text-white line-clamp-1 hover:text-red-400 cursor-pointer">
                          {anime.title}
                        </h4>
                        <div className="flex items-center justify-between mt-2 pt-2 border-t border-white/5 text-[11px] text-slate-400">
                          <span>{anime.year}</span>
                          <button onClick={() => handleToggleList(anime.id)} className="hover:text-white">
                            <Icon name={myList.includes(anime.id) ? "check" : "plus"} className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </main>

          {/* MODAL DETALLES */}
          <DetailsModal
            anime={selectedAnime}
            onClose={() => setSelectedAnime(null)}
            onPlay={(a) => { setSelectedAnime(null); setPlayingAnime(a); }}
            onDelete={handleDeleteAnime}
            isSaved={selectedAnime ? myList.includes(selectedAnime.id) : false}
            onToggleList={handleToggleList}
          />

          {/* REPRODUCTOR VIDEO COMPLETO */}
          {playingAnime && (
            <VideoPlayer
              anime={playingAnime}
              onClose={() => setPlayingAnime(null)}
            />
          )}

          {/* MODAL SUBIR ANIME */}
          <UploadModal
            isOpen={uploadOpen}
            onClose={() => setUploadOpen(false)}
            onSave={handleSaveUpload}
          />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
